services:
  - type: web
    name: wedding-sergey-lyudmila
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-rsvp-db
          property: connectionString

databases:
  - name: wedding-rsvp-db
    plan: free
